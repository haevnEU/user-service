<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Passwort vergessen</title>
        <link href="/css/color.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/forgot-password-layout.css" rel="stylesheet">
    </head>
    <body>
        <div class="login-container">
            <div class="brand-side">
                <div class="logo-placeholder">
                    <img alt="Logo" th:src="@{/images/logo.svg}">
                </div>
                <h1 th:text="${companyName}"></h1>
                <p th:text="${slogan}"></p>
            </div>

            <div class="form-side">
                <div class="login-box">
                    <h2>Passwort zurücksetzen</h2>
                    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">
                        Gib deine E-Mail-Adresse ein. Wir senden dir einen Link zum Zurücksetzen.
                    </p>

                    <div style="color: #16a34a; margin-bottom: 15px; font-weight: 600;" th:if="${success}" th:text="${success}"></div>
                    <div style="color: #dc2626; margin-bottom: 15px; font-weight: 600;" th:if="${error}" th:text="${error}"></div>

                    <form method="POST" th:action="@{/forgot-password}">
                        <div class="form-group">
                            <label for="username">E-Mail-Adresse</label>
                            <input id="username" name="username" placeholder="name@firma.de" required type="email">
                        </div>
                        <button class="btn-submit" type="submit">Link anfordern</button>
                    </form>

                    <div style="margin-top: 25px; text-align: center;">
                        <a href="/login" style="color: #2563eb; text-decoration: none; font-size: 0.9rem; font-weight: 500;">
                            ← Zurück zum Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

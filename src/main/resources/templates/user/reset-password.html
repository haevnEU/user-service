<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Neues Passwort vergeben</title>
        <link href="/css/color.css" rel="stylesheet">
        <link href="/css/common.css" rel="stylesheet">
        <link href="/css/forgot-password-layout.css" rel="stylesheet">
    </head>
    <body>
        <div class="login-container">
            <div class="brand-side">
                <div class="logo-placeholder">
                    <img alt="Logo" th:src="@{/images/logo.svg}">
                </div>
                <h1 th:text="${companyName}"></h1>
                <p th:text="${slogan}"></p>
            </div>

            <div class="form-side">
                <div class="login-box">
                    <h2>Neues Passwort wählen</h2>
                    <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">
                        Gib jetzt dein neues, sicheres Passwort für deinen Account ein.
                    </p>

                    <form method="POST" th:action="@{/forgot-password/reset}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input name="token" th:value="${token}" type="hidden">

                        <div class="form-group">
                            <label for="password">Neues Passwort</label>
                            <input id="password" minlength="8" name="password" placeholder="••••••••" required type="password">
                        </div>
                        <button class="btn-submit" type="submit">Passwort speichern</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
